[package]
name = "swarmy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
mime_guess = "2.0.5"
rand = "0.10.3"
swarmy-engine = { version = "0.1.0", path = "../engine" }
swarmy-usenet = { path = "../usenet" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
form_urlencoded = "1.2.2"
maxminddb = { version = "0.32", features = ["mmap"] }
flate2 = "1"

# Linux release builds carry their own OpenSSL, so one binary runs on any
# glibc 2.35+ distro (Debian 12, Ubuntu 22.04+, Raspberry Pi OS) with no
# system libssl requirement. Windows uses the OS TLS stack.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
