[workspace]
resolver = "3"
members = ["crates/engine", "crates/server", "crates/usenet"]

[workspace.package]
edition = "2024"
# Cargo needs semver, so this is only the date. Swarmy's real version is
# yyyy.mm.dd.build, the newest entry in CHANGELOG.md (see crates/server/build.rs).
version = "2026.11.5"
license = "MIT OR Apache-2.0"
