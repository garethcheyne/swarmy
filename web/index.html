<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Swarmy</title>
    <meta name="description" content="BitTorrent client with a qBittorrent-compatible API for Sonarr and Radarr." />
    <meta name="theme-color" content="#0e1510" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Swarmy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="status-bar-style" />
    <script>
      // Settings > About > "Solid status bar on iPhone": set before iOS reads it.
      try {
        if (localStorage.getItem("swarmy.statusbar") === "solid")
          document.getElementById("status-bar-style").setAttribute("content", "black")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
