# Push a tag like v0.1.0 and this builds Swarmy for Linux x86-64 and ARM64,
# publishes a GitHub release (what install/install.sh downloads) and pushes
# the multi-arch image to ghcr.io/garethcheyne/swarmy.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    name: Linux ${{ matrix.arch }}
    needs: web
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Built against Debian 12's glibc (2.36), so the binary runs on Debian 12+,
    # Ubuntu 22.04+, Proxmox VE 8+ containers and most current distros.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Check the UI is there to embed
        run: test -f web/dist/index.html
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - run: cargo build --release --locked -p swarmy
      - name: Package
        run: |
          name="swarmy-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p stage out
          cp target/release/swarmy LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md CHANGELOG.md stage/
          strip stage/swarmy
          ./stage/swarmy --version
          tar -czf "out/$name.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: out/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Install

          See the [README](https://github.com/garethcheyne/swarmy#install) for Docker, the Linux one-liner and the Proxmox LXC installer.
          EOF
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Swarmy ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Unpack the binaries per platform
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            mkdir -p "image/${pair%%:*}"
            tar -xzf "dist/swarmy-${GITHUB_REF_NAME}-linux-${pair##*:}.tar.gz" -C "image/${pair%%:*}"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Swarmy
            org.opencontainers.image.description=BitTorrent and Usenet client with a modern web UI, compatible with Sonarr, Radarr and Prowlarr
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: image
          file: deploy/release.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
